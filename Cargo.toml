[package]
name = "scotshreen"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
global-hotkey = "0.10.0"
mouse_position = "0.1.4"
softbuffer = "0.4.8"
tray-icon = "0.26.1"
winit = "0.30.13"
xcap = "0.9.10"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
png = "0.18.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
resvg = { version = "0.50.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSWindow", "NSResponder", "NSColor", "NSScreen", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSArray", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
